<body data-page="policy">

    <button class="menu-toggle" aria-label="Mở menu" aria-expanded="false">☰</button>
    <nav class="main-nav" aria-label="Điều hướng chính">
      <a href="index.html">Khám phá</a><a href="search.html">Tìm kiếm</a><a href="artist-songs.html">Nghệ sĩ</a><a

    </nav>
    <a class="premium-link" href="contact.html">Premium <span>↗</span></a>
  </header>
  <main id="main-content" class="page-shell"></main>
  <footer class="site-footer">
    <div><a class="brand" href="index.html"><span class="brand-mark">♫</span> sound<span>wave</span></a>
      <p>Âm nhạc kết nối những tâm hồn.</p>

    <div class="footer-links"><a href="about.html">Về chúng tôi</a><a href="contact.html">Liên hệ</a><a

    <small>© 2026 SoundWave. Dự án giao diện học tập.</small>

  <section class="player" aria-label="Trình phát nhạc">
    <div class="player-track"><img id="player-cover" src="resource/covers/soundwave.svg" alt="Bìa bài hát">
      <div><strong id="player-title">Chưa phát bài hát</strong><span id="player-artist">Chọn một ca khúc để bắt
          đầu</span></div>
    </div>
    <div class="player-controls">
      <div class="control-buttons"><button id="prev-btn" aria-label="Bài trước">⏮</button><button id="play-btn"
          class="play-main" aria-label="Phát nhạc">▶</button><button id="next-btn" aria-label="Bài tiếp">⏭</button>
      </div>
      <div class="timeline"><span id="current-time">0:00</span><input id="seek-bar" type="range" min="0" max="100"
          value="0" aria-label="Tua bài hát"><span id="total-time">0:00</span></div>
    </div>
    <div class="player-volume"><span>♪</span><input id="volume-bar" type="range" min="0" max="1" step="0.01" value="0.8"
        aria-label="Âm lượng"></div>
    <audio id="audio-player" preload="metadata"></audio>
  </section>
  <script src="js/songs.js"></script>
  <script src="js/script.js"></script>
